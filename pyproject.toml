[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "levy-walks-maxent"
version = "0.1.0"
description = "Dynamic maximum-entropy inference, exact solvable limits, and self vs. social decomposition for individual and collective Lévy walks."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Adriano Barra"},
    {name = "Andrea Ladiana", email = "andrea.ladiana@uniroma1.it"},
]
keywords = [
    "levy-walks",
    "maximum-entropy",
    "maximum-caliber",
    "statistical-physics",
    "collective-motion",
    "animal-movement",
    "non-markovian-dynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "numba>=0.58",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/coscienza-research/levy-walks-maxent"

[tool.setuptools]
package-dir = {"" = "code"}
py-modules = [
    "maxent_levy",
    "joint",
    "collective",
    "collective_dir",
    "meanfield",
    "simulate",
    "simulate_collective",
    "baselines",
    "realdata",
    "realgroups",
    "baboon_data",
    "pigeon_data",
    "safe",
]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["code"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

